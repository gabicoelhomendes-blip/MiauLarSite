
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar senha | MiauLar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tema-original.css">
</head>
<script src="js/tema-original.js" defer></script>
<body class="pagina-alterar-senha">

    <header class="cabecalho-senha">
        <div class="conteudo-cabecalho-senha">
            <a href="index.html" class="logo-senha">MiauLar</a>

            <nav aria-label="Navegação principal">
                <a href="index.html">Início</a>
                <a href="alterar-senha.html" aria-current="page">
                    Alterar senha
                </a>
            </nav>
        </div>
    </header>

    <main class="principal-senha">
        <section class="painel-senha">
            <span class="etiqueta-senha">MINHA CONTA</span>

            <h1>Alterar senha</h1>

            <p class="descricao-senha">
                Atualize sua senha para manter sua conta segura.
                Após a alteração, será necessário entrar novamente.
            </p>

            <form id="formulario-senha">
                <div class="campo-senha">
                    <label for="senha-atual">Senha atual</label>
                    <input
                        type="password"
                        id="senha-atual"
                        name="senhaAtual"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="campo-senha">
                    <label for="nova-senha">Nova senha</label>
                    <input
                        type="password"
                        id="nova-senha"
                        name="novaSenha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small>Mínimo de 8 caracteres.</small>
                </div>

                <div class="campo-senha">
                    <label for="confirmar-senha">Confirmar nova senha</label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmarSenha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <p
                    id="mensagem-senha"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="botao-salvar-senha"
                    class="botao-salvar-senha"
                >
                    Salvar nova senha
                </button>
            </form>

            <div class="rodape-painel-senha">
                <a href="index.html">Voltar ao início</a>
            </div>
        </section>
    </main>

    <footer class="rodape-senha">
        MiauLar - Adoção responsável de gatos.
    </footer>

    <script type="module" src="js/alterar-senha.js"></script>
</body>
</html>
