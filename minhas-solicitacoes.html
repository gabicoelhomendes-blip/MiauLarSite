
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas solicitações | MiauLar</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tema-original.css">
</head>

<body class="pagina-solicitacoes pagina-solicitacoes-original">

    <main class="principal-solicitacoes">
        <section class="painel-solicitacoes">

            <div class="cabecalho-pedidos-original">
                <span class="etiqueta-pedidos-original">
                    ACOMPANHAMENTO
                </span>

                <h1>Minhas solicitações</h1>

                <p>
                    Leia os questionários e acompanhe as
                    decisões por animal.
                </p>
            </div>

            <div
                id="mensagem-solicitacoes"
                class="mensagem-pedidos-original"
                role="status"
                aria-live="polite"
            >
                Carregando suas solicitações...
            </div>

            <div
                id="lista-solicitacoes"
                class="lista-solicitacoes"
            ></div>

            <div class="rodape-painel-solicitacoes">
                <a
                    href="index.html#catalogo"
                    class="voltar-catalogo"
                >
                    Explorar gatos →
                </a>
            </div>

        </section>
    </main>

    <script
        type="module"
        src="js/minhas-solicitacoes.js"
    ></script>

    <script
        src="js/tema-original.js"
        defer
    ></script>

</body>
</html>
